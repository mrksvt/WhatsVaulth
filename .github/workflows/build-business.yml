name: Build Business

on:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Install NDK + CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.2.13676358 cmake;3.22.1'

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Business Debug
        run: ./gradlew assembleBusinessDebug

      - name: Verify native libs in APK
        run: |
          APK=$(ls app/build/outputs/apk/business/debug/WhatsVault-Business*.apk | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "\.so|lib/" || echo "NO NATIVE LIBS FOUND"

      - name: Get APK name
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/business/debug/WhatsVault-Business*.apk | head -1)
          echo "file=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK")" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.file }}
