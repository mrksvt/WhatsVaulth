name: Release

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Install NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.2.13676358 cmake;3.22.1'

      - name: Write signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ -z "$KEY_STORE" ]; then
            echo "::error::Secret KEY_STORE kosong. Release dibatalkan."
            exit 1
          fi
          echo androidStoreFile=key.jks > signing.properties
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> signing.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> signing.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> signing.properties
          echo "$KEY_STORE" | base64 --decode > key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build four variants
        run: |
          ./gradlew \
            assembleWhatsappDebug \
            assembleWhatsappRelease \
            assembleBusinessDebug \
            assembleBusinessRelease \
            --console=plain

      - name: Stage and verify APKs
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk -type f -name 'WhatsVault*.apk' -print0 | while IFS= read -r -d '' apk; do
            name=$(basename "$apk" | sed 's/ (/./g; s/)/./g')
            cp "$apk" "release-assets/$name"
          done
          count=$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::Harus ada 4 APK, ditemukan $count"
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi
          sha256sum release-assets/*.apk | tee release-assets/SHA256SUMS.txt
          for apk in release-assets/*.apk; do
            echo "Verifying $apk"
            unzip -l "$apk" | grep -E '\.so|lib/' >/dev/null || {
              echo "::error::Native library tidak ditemukan di $apk"
              exit 1
            }
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: WhatsVault-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
